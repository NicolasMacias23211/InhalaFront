<!-- src/app/users-tables/users-tables.component.html -->
<div>
    <div class="row">
        <div class="col-12">
            <h1>Usuarios registrados en el sistema:</h1>
            <div class="mat-elevation-z8">
                <table mat-table [dataSource]="dataSource" class="table table-striped table-hover">
        
                    <ng-container matColumnDef="Nombre">
                    <th mat-header-cell *matHeaderCellDef> Nombre </th>
                    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                    </ng-container>
        
                    <ng-container matColumnDef="PrimerApellido">
                    <th mat-header-cell *matHeaderCellDef> Primer Apellido </th>
                    <td mat-cell *matCellDef="let element"> {{element.lastName}} </td>
                    </ng-container>
        
                    <ng-container matColumnDef="Documento">
                    <th mat-header-cell *matHeaderCellDef> Documento </th>
                    <td mat-cell *matCellDef="let element"> {{element.document}} </td>
                    </ng-container>
        
                    <ng-container matColumnDef="CorreoElectronico">
                    <th mat-header-cell *matHeaderCellDef> Correo Electrónico </th>
                    <td mat-cell *matCellDef="let element"> {{element.mail}} </td>
                    </ng-container>
        
                    <ng-container matColumnDef="Telefono">
                    <th mat-header-cell *matHeaderCellDef> Teléfono </th>
                    <td mat-cell *matCellDef="let element"> {{element.phone}} </td>
                    </ng-container>
        
                    <ng-container matColumnDef="Direccion">
                    <th mat-header-cell *matHeaderCellDef> Dirección </th>
                    <td mat-cell *matCellDef="let element"> {{element.address}} </td>
                    </ng-container>
        
                    <ng-container matColumnDef="Ocupacion">
                    <th mat-header-cell *matHeaderCellDef> Ocupación </th>
                    <td mat-cell *matCellDef="let element"> {{element.fieldsOfStudy}} </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
                <mat-paginator [pageSizeOptions]="[5, 10, 15]" showFirstLastButtons></mat-paginator>
            </div>
            <br>
            <br>
        </div>
    </div>  
</div>
